[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/adb", "crates/jni"]

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
authors = ["Lev Burmistrov (Mahiron-hq)"]
repository = "https://github.com/Mahiron-hq/MahiRoute"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Domain types repeat their module name on purpose (DeviceKind in device.rs).
module_name_repetitions = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
