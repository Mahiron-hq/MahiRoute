name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Audio routing depends on the phone's firmware, so the device details below matter.
        Security problems: do not use this form, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model
      placeholder: Redmi Note 10S
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and ROM
      placeholder: Android 13, MIUI 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MahiRoute version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: start
    attributes:
      label: How was the helper started?
      options:
        - Wireless debugging on the phone
        - MahiRoute-start.bat from a computer
        - It did not start
        - Not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics screen
      description: Open the info button in the app and copy the helper section ("How this firmware behaves") and the connected devices.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
