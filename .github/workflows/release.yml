name: Release

# Pushing a tag such as v1.0.0 builds the signed APK and publishes a GitHub release.
# Running the workflow by hand only builds the package and keeps it as an artifact.
#
# Secrets used by the build job: RELEASE_KEYSTORE_BASE64 (the keystore, base64-encoded),
# RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.
# The build and publish jobs stay skipped until the repository variable RELEASE_SIGNING is set
# to "true", which is done once the secrets exist; until then releases are uploaded by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: 1.95.0
  CARGO_NDK_VERSION: 4.1.2
  NDK_VERSION: 29.0.14206865

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    name: Signed APK
    needs: tests
    if: ${{ vars.RELEASE_SIGNING == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.1.0 ndk;${{ env.NDK_VERSION }}
      - name: Install build tools for BoringSSL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - uses: gradle/actions/setup-gradle@v6
      - name: Read the app version
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v${{ steps.version.outputs.version }}" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match versionName ${{ steps.version.outputs.version }}"; exit 1; }
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleRelease
      - name: Remove the signing key and write the checksums
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MahiRoute-${{ steps.version.outputs.version }}.apk"
          (cd dist && sha256sum MahiRoute-*.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.apk
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MahiRoute $GITHUB_REF_NAME" > notes.md
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          make_latest: true
